<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cloudirve 私人文件管理器" />
  <title>Cloudirve Drive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="app" class="app-shell"></main>
  <dialog id="share-dialog" class="confirm-dialog input-dialog">
    <form method="dialog">
      <p class="eyebrow">Cloudirve</p>
      <h2 id="share-title">创建分享</h2>
      <div id="share-create-fields">
        <div class="field"><label for="share-days">有效期</label><select id="share-days" class="input"><option value="1">1 天</option><option value="7" selected>7 天</option><option value="30">30 天</option></select></div>
        <div class="field"><label for="share-password">访问密码（可选）</label><input id="share-password" type="text" class="input" placeholder="留空则无需密码" autocomplete="off" maxlength="64" /></div>
      </div>
      <div id="share-result" hidden>
        <div class="field"><label for="share-link">分享链接（有效期 7 天）</label><input id="share-link" class="input" readonly onclick="this.select()" /></div>
        <p class="muted" id="share-expire-note"></p>
      </div>
      <p class="error-text" id="share-error" role="alert"></p>
      <div class="dialog-actions"><button value="cancel" class="button button-ghost" type="submit">关闭</button><button value="confirm" id="share-submit" class="button button-primary" type="submit">创建分享</button></div>
    </form>
  </dialog>
  <aside id="upload-panel" class="upload-panel" hidden></aside>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <dialog id="confirm-dialog" class="confirm-dialog">
    <form method="dialog">
      <p class="eyebrow">请确认操作</p>
      <h2 id="confirm-title">确认删除？</h2>
      <p id="confirm-copy" class="muted">项目将移入回收站。</p>
      <div class="dialog-actions"><button value="cancel" class="button button-ghost">取消</button><button value="confirm" id="confirm-action" class="button button-danger">确认</button></div>
    </form>
  </dialog>
  <dialog id="preview-dialog" class="preview-dialog">
    <div class="preview-head">
      <h2 id="preview-title">预览</h2>
      <div class="preview-actions"><a id="preview-download" class="button button-ghost" download>下载原文件</a><button id="preview-close" class="icon-button" aria-label="关闭预览" title="关闭">✕</button></div>
    </div>
    <div id="preview-body" class="preview-body"></div>
  </dialog>
  <dialog id="office-dialog" class="office-dialog">
    <div class="preview-head"><h2 id="office-title">在线编辑</h2><button id="office-close" class="icon-button" aria-label="关闭在线编辑" title="关闭">✕</button></div>
    <div id="office-body" class="office-body"><div class="state-message">正在加载在线编辑器…</div></div>
  </dialog>
  <dialog id="input-dialog" class="confirm-dialog input-dialog">
    <form method="dialog">
      <p class="eyebrow">Cloudirve</p>
      <h2 id="input-title">新建文件夹</h2>
      <div class="field"><label id="input-label" for="input-value">名称</label><input id="input-value" class="input" maxlength="180" autocomplete="off" /></div>
      <p class="error-text" id="input-error" role="alert"></p>
      <div class="dialog-actions"><button value="cancel" class="button button-ghost" type="submit">取消</button><button value="confirm" id="input-confirm" class="button button-primary" type="submit">确定</button></div>
    </form>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
